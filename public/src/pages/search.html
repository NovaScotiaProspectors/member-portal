<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/styles/styles.css" />
  <title>Search · NSPA</title>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <div class="page-wrap">
    <nav class="site-nav" aria-label="Site navigation"></nav>

    <header class="page-header">
      <p class="eyebrow">Member Portal</p>
      <h1>Search <span>Everything</span></h1>
      <p class="subtitle">Projects, members, companies, commodities, counties and tenure numbers.</p>
    </header>

    <main id="main">
      <div class="stack-card">
        <div class="form-section">
          <div class="field full">
            <label for="q">Search</label>
            <input type="search" id="q" autocomplete="off" autofocus
                   placeholder="Try a project name, company, county, or tenure number…"
                   aria-describedby="searchHint" />
            <p class="form-hint" id="searchHint">Type at least two characters. Results respect project visibility.</p>
          </div>

          <div id="results" aria-live="polite" aria-busy="false">
            <p class="form-hint">Start typing to search.</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/modules/nav.js"></script>
  <script src="/modules/portal.js"></script>
  <script src="/modules/member-portal.js"></script>
</body>
</html>
