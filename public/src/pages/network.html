<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/styles/styles.css" />
  <title>Network · NSPA</title>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="page-wrap">
    <nav class="site-nav" aria-label="Site navigation"></nav>

    <header class="page-header">
      <p class="eyebrow">Member Network</p>
      <h1>Find <span>Members</span></h1>
      <p class="subtitle">Search the active member directory and contact other members of the association.</p>
    </header>

    <main id="main">

    <div class="stack-card network-join-card">
      <div class="form-section" id="networkJoinBody">
        <p class="section-label">Your Network Profile</p>
        <p class="form-hint">Loading your network status...</p>
      </div>
    </div>

    <div class="stack-card">
      <div class="form-section">
        <div class="network-toolbar">
          <p class="section-label">Directory</p>
          <span class="prices-updated" id="memberCount" role="status" aria-live="polite">Loading…</span>
        </div>

        <div class="field network-search">
          <label for="networkSearch">Search Members</label>
          <input type="text" id="networkSearch" placeholder="Search by name, company, location, or member ID" autocomplete="off" />
        </div>

        <div class="network-filters" aria-label="Directory filters">
          <div class="field">
            <label for="commodityFilter">Commodity</label>
            <select id="commodityFilter">
              <option value="">All commodities</option>
            </select>
          </div>
          <div class="field">
            <label for="projectFilter">Project</label>
            <select id="projectFilter">
              <option value="">All projects</option>
            </select>
          </div>
          <div class="field">
            <label for="tenureFilter">Tenure Number</label>
            <select id="tenureFilter">
              <option value="">All tenures</option>
            </select>
          </div>
          <div class="field">
            <label for="depositFilter">Deposit Type</label>
            <select id="depositFilter">
              <option value="">All deposit types</option>
            </select>
          </div>
        </div>

        <div class="member-grid" id="networkBody">
          <p class="form-hint">Loading members…</p>
        </div>
      </div>
    </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/modules/nav.js"></script>
  <script src="/modules/portal.js"></script>
  <script src="/modules/member-portal.js"></script>
</body>
</html>
