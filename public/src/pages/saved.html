<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/styles/styles.css" />
  <title>Saved Projects · NSPA</title>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <div class="page-wrap">
    <nav class="site-nav" aria-label="Site navigation"></nav>

    <header class="page-header">
      <p class="eyebrow">Member Portal</p>
      <h1>Saved <span>Projects</span></h1>
      <p class="subtitle">Projects you've bookmarked for later.</p>
    </header>

    <main id="main">
      <div class="stack-card">
        <div class="form-section">
          <div class="prices-toolbar">
            <p class="section-label" style="margin-bottom: 0;">Bookmarks</p>
            <a class="secondary-btn" href="/map.html">Browse Project Map</a>
          </div>
          <div id="savedBody" aria-busy="true">
            <p class="form-hint">Loading your saved projects…</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/modules/nav.js"></script>
  <script src="/modules/portal.js"></script>
  <script src="/modules/member-portal.js"></script>
</body>
</html>
