<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/styles/styles.css" />
  <title>Resource Library · NSPA</title>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <div class="page-wrap">
    <nav class="site-nav" aria-label="Site navigation"></nav>

    <header class="page-header">
      <p class="eyebrow">Member Portal</p>
      <h1>Resource <span>Library</span></h1>
      <p class="subtitle">Geological reports, exploration guides, regulations, templates, and technical documents.</p>
    </header>

    <main id="main">
      <!-- Admin-only: add a resource. Hidden for regular members. -->
      <div class="stack-card" id="adminCard" hidden>
        <div class="form-section">
          <p class="section-label">Add a Resource</p>
          <form id="resourceForm" novalidate>
            <div class="grid-2">
              <div class="field">
                <label for="res-title">Title</label>
                <input type="text" id="res-title" required placeholder="NS Gold Districts Compilation" />
              </div>
              <div class="field">
                <label for="res-category">Category</label>
                <select id="res-category" required></select>
              </div>
              <div class="field full">
                <label for="res-description">Description</label>
                <textarea id="res-description" placeholder="What this resource covers…"></textarea>
              </div>
              <div class="field">
                <label for="res-file">File <span class="label-optional">(or provide a link)</span></label>
                <input type="file" id="res-file"
                       accept=".pdf,.doc,.docx,.xls,.xlsx,.csv,.jpg,.jpeg,.png" />
              </div>
              <div class="field">
                <label for="res-url">External link</label>
                <input type="text" id="res-url" placeholder="https://novascotia.ca/natr/meb/…" />
              </div>
            </div>
            <div class="dash-actions">
              <button type="submit" class="submit-btn" id="addResourceBtn">Add Resource</button>
            </div>
          </form>
        </div>
      </div>

      <div class="stack-card">
        <div class="form-section">
          <p class="section-label">Browse</p>

          <div class="field full">
            <label for="resourceSearch">Search the library</label>
            <input type="search" id="resourceSearch" placeholder="Search by title or description…"
                   autocomplete="off" aria-describedby="searchHint" />
            <p class="form-hint" id="searchHint">Filter by category below, or search across every resource.</p>
          </div>

          <div class="filter-chips" id="categoryFilter" role="group" aria-label="Filter resources by category">
            <button type="button" class="filter-chip active" data-category="">All</button>
          </div>

          <div id="resourceBody" aria-busy="true" aria-live="polite">
            <p class="form-hint">Loading the library…</p>
          </div>

          <div class="pager" id="pager" hidden>
            <button type="button" class="secondary-btn" id="loadMoreBtn">Load More</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/modules/nav.js"></script>
  <script src="/modules/portal.js"></script>
  <script src="/modules/content.js"></script>
</body>
</html>
